<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BA Accelerator — AI Development Orchestrator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      @view-transition { navigation: auto; }
      html, body {
        background-color: #1B1B3A;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      #root {
        height: 100%;
        background-color: #F7F9FB;
      }
      ::view-transition-old(universal-sidebar),
      ::view-transition-new(universal-sidebar) {
        animation: none;
        mix-blend-mode: normal;
      }
      ::view-transition-old(root) {
        animation: 60ms ease-out both fade-out;
      }
      ::view-transition-new(root) {
        animation: 60ms ease-in both fade-in;
      }
      @keyframes fade-out {
        to { opacity: 0; }
      }
      @keyframes fade-in {
        from { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
