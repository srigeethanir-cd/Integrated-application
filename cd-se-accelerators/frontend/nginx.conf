server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: return 404 for missing files, NOT the SPA fallback.
    # This prevents a stale cached JS hash from receiving text/html (MIME error).
    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback for all page routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

