events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Main Application (BA) Backend
    upstream ba-backend {
        server backend:8000;
    }

    # Main Application (BA) Frontend
    upstream ba-frontend {
        server frontend:3000;
    }

    # Unit Test Cases (cd-se-accelerators) Backend
    upstream unittest-backend {
        server unittest-backend:8000;
    }

    # Unit Test Cases (cd-se-accelerators) Frontend
    upstream unittest-frontend {
        server unittest-frontend:80;
    }

    # Test-Case-Generation Backend
    upstream testcase-backend {
        server testcase-backend:8006;
    }

    # Test-Case-Generation Frontend
    upstream testcase-frontend {
        server testcase-frontend:3000;
    }

    # test-case-accelerator Backend
    upstream testcase-accelerator-backend {
        server testcase-accelerator-backend:8000;
    }

    # test-case-accelerator Frontend
    upstream testcase-accelerator-frontend {
        server testcase-accelerator-frontend:80;
    }

    server {
        listen 80;
        server_name localhost;
        proxy_redirect http://$host/ http://$host:8080/;

        # Swagger Docs, API Endpoints for Main Backend
        location ~ ^/(api|docs|redoc|openapi.json|health) {
            proxy_pass http://ba-backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Unit Test Cases Backend API
        location /unit-test-cases/api/ {
            # Strip /unit-test-cases/api prefix and pass to unittest-backend
            rewrite ^/unit-test-cases/api/(.*)$ /$1 break;
            proxy_pass http://unittest-backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Unit Test Cases Frontend
        location = /unit-test-cases {
            return 301 $scheme://$host:8080$request_uri/;
        }

        location /unit-test-cases/ {
            proxy_pass http://unittest-frontend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Test-Case-Generation Backend API
        location /application-testing/api/ {
            rewrite ^/application-testing/(.*)$ /$1 break;
            proxy_pass http://testcase-backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Test-Case-Generation Backend Docs
        location ~ ^/application-testing/(docs|redoc|openapi.json) {
            rewrite ^/application-testing/(.*)$ /$1 break;
            proxy_pass http://testcase-backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Test-Case-Generation Frontend
        location = /application-testing {
            return 301 $scheme://$host:8080$request_uri/;
        }

        location /application-testing/ {
            proxy_pass http://testcase-frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # test-case-accelerator Backend API
        location /backend-unit-testcase-generator/api/ {
            rewrite ^/backend-unit-testcase-generator/api/(.*)$ /$1 break;
            proxy_pass http://testcase-accelerator-backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # test-case-accelerator Backend Docs
        location ~ ^/backend-unit-testcase-generator/(docs|redoc|openapi.json) {
            rewrite ^/backend-unit-testcase-generator/(.*)$ /$1 break;
            proxy_pass http://testcase-accelerator-backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # test-case-accelerator Frontend
        location = /backend-unit-testcase-generator {
            return 301 $scheme://$host:8080$request_uri/;
        }

        location /backend-unit-testcase-generator/ {
            proxy_pass http://testcase-accelerator-frontend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js Main Frontend
        location / {
            proxy_pass http://ba-frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
